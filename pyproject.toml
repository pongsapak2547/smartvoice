[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartvoice"
version = "0.1.0"
description = "AI-powered Call Center Analytics — Thai STT, diarization, and LLM analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.55.0",
    "plotly>=6.0.0,<7.0.0",
    "pandas>=2.3.0,<3.0.0",
    "matplotlib>=3.10.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "fpdf2>=2.8.0,<3.0.0",
    "uharfbuzz>=0.39.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
]

[project.scripts]
smartvoice = "smartvoice.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["smartvoice*"]
